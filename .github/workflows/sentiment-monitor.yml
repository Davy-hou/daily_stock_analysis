name: 市场情绪日报
run-name: A股情绪分析 @ ${{ github.run_attempt }}

on:
  schedule:
    # 北京时间 15:30 (UTC 07:30) 收盘后
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sentiment-monitor
  cancel-in-progress: false

jobs:
  sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行情绪分析
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          # 搜索与 LLM 配置（付费搜索 + 情绪判定）
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
        run: python -u scripts/sentiment_monitor.py

      - name: 提交并推送历史数据
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/sentiment
          git add -f data/sentiment/
          if git diff --cached --quiet; then
            echo "ℹ️ 无新增/变更的历史数据"
          else
            git commit -m "chore: 更新市场情绪历史数据 [skip ci]"
            git push origin main
            echo "✅ 历史数据已推送"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
