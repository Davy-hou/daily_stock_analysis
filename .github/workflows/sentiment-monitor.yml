name: 市场情绪日报
run-name: A股情绪分析 @ ${{ github.run_attempt }}

on:
  schedule:
    # 北京时间 15:30 (UTC 07:30) 收盘后
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sentiment-monitor
  cancel-in-progress: false

jobs:
  sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行情绪分析
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python -u scripts/sentiment_monitor.py
